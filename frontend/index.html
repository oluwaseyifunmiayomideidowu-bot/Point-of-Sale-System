<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Sign in — Vendly
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pages.css">
  </head>
  <body class="login-page">
    <main class="auth-layout">
      <section class="login-brand-panel">
        <a class="brand" href="index.html">
          <img src="vendly-logo.jpeg" alt="Vendly logo">
          <span>
            vendly
          </span>
        </a>
        <div class="login-message">
          <p>
            RETAIL, REFINED
          </p>
          <h1>
            Built for the
            <br>
            <em>
              rhythm
            </em>
            of retail.
          </h1>
          <span>
            Sell confidently, manage thoughtfully, and keep every detail close.
          </span>
        </div>
        <footer>
          © 2026 Vendly
          <span>
            Built in Lagos
          </span>
        </footer>
      </section>
      <section class="login-form-panel">
        <form class="login-form" action="dashboard.html">
          <p class="eyebrow">
            WELCOME BACK
          </p>
          <h2>
            Sign in to your shop.
          </h2>
          <p class="intro">
            Enter your details to continue to Buka Market.
          </p>
          <label>
            Email address
            <input name="email" type="email" placeholder="you@business.com" required>
          </label>
          <label>
            Password
            <a href="#">
              Forgot password?
            </a>
            <input name="password" type="password" placeholder="Your password" required>
          </label>
          <label class="remember">
            <input type="checkbox">
            Keep me signed in
          </label>
          <button class="btn copper wide" type="submit">
            Sign in
            <span>
              →
            </span>
          </button>
          <p class="auth-switch">
            New to Vendly?
            <a href="signup.html">
              Create your workspace
            </a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
